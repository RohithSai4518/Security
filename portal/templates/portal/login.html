{% extends "portal/base.html" %}

{% block title %}User Login{% endblock %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="card p-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock text-info display-4"></i>
                <h3 class="mt-2 text-white">Account Login</h3>
                <p class="text-muted small">Enter your credentials to access your secure storage</p>
            </div>

            <form method="post" novalidate>
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label text-light small fw-semibold">Username</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-person"></i></span>
                        <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label text-light small fw-semibold">Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-dark border-secondary text-muted"><i class="bi bi-key"></i></span>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
                </button>
            </form>

            <div class="text-center mt-4 pt-3 border-top border-secondary">
                <p class="text-muted small mb-0">Don't have an account? <a href="{% url 'register' %}" class="text-info text-decoration-none">Register here</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
